<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wedding Invitation</title>

    <!-- FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ===========================
         INTRO / ENVELOPE
    ============================ -->

    <div id="intro">

        <img
            src="foto.PNG"
            alt="Wedding envelope"
            id="envelope"
        >

        <!-- КЛІК ТІЛЬКИ ПО ПЕЧАТЦІ -->

        <button
            id="sealButton"
            aria-label="Відкрити запрошення"
        ></button>

    </div>



    <!-- ===========================
         MUSIC
    ============================ -->

    <audio id="music">

        <source
            src="music.mp3"
            type="audio/mpeg"
        >

    </audio>



    <!-- ===========================
         MAIN WEDDING SITE
    ============================ -->

    <main id="site">


        <!-- HERO -->

        <section class="hero">

            <div class="hero-content">

                <h1 class="names">

                    <span>Олексій</span>

                    <span class="ampersand">&amp;</span>

                    <span>Наталія</span>

                </h1>


                <p class="wedding-date">
                    09 • 09 • 2026
                </p>


                <div class="scroll-down">

                    <span>⌄</span>

                </div>

            </div>

        </section>



        <!-- ===========================
             INVITATION
        ============================ -->
<section class="invitation reveal">

    <div class="handkerchief">

        <img src="lace.png" alt="" class="handkerchief-image">

        <div class="handkerchief-text">

            <p class="invitation-title">
                Дорогі наші гості!
            </p>

            <p class="invitation-main">
                Запрошуємо вас розділити
                з нами цей особливий день
            </p>

            <p class="invitation-end">
                Будемо чекати на вас
            </p>

        </div>

    </div>

</section>
        
        


        <!-- ===========================
             CALENDAR
        ============================ -->

        <section class="calendar-section">

            <div class="section-inner">

                <p class="eyebrow">
                    Збережіть дату
                </p>


                <h2>
                    Вересень 2026
                </h2>


                <div class="calendar">


                    <div class="weekdays">

                        <span>Пн</span>
                        <span>Вт</span>
                        <span>Ср</span>
                        <span>Чт</span>
                        <span>Пт</span>
                        <span>Сб</span>
                        <span>Нд</span>

                    </div>


                   <div class="days">

    <span></span>

    <span>1</span>
    <span>2</span>
    <span>3</span>
    <span>4</span>
    <span>5</span>
    <span>6</span>

    <span>7</span>
    <span>8</span>
    <span class="selected">9</span>
    <span>10</span>
    <span>11</span>
    <span>12</span>
    <span>13</span>

    <span>14</span>
    <span>15</span>
    <span>16</span>
    <span>17</span>
    <span>18</span>
    <span>19</span>
    <span>20</span>

    <span>21</span>
    <span>22</span>
    <span>23</span>
    <span>24</span>
    <span>25</span>
    <span>26</span>
    <span>27</span>

    <span>28</span>
    <span>29</span>
    <span>30</span>

</div>
                    
                </div>

            </div>

        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
